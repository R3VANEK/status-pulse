version: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    user: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:7.0.5
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    restart: always
    command: uvicorn statusPulse.asgi:application --host 0.0.0.0 --port 8000 --reload

    tty: true
    stdin_open: true
    depends_on:
      - db
      - s3
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: "http://s3:9000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  front:
    build:
      context: .
      dockerfile: ./build/frontend/Dockerfile
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
      FAST_REFRESH: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  celery:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    depends_on:
      - db
      - redis
      - api
      - s3
    command: celery -A statusPulse worker -E -l info
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: "http://s3:9000"
    volumes:
      - ./backend:/app

  flower:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    depends_on:
      - db
      - redis
      - api
      - celery
      - s3
    command: celery -A statusPulse flower --port=5555
    ports:
      - "${FLOWER_PORT}:5555"
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: "http://s3:9000"
    volumes:
      - ./backend:/app

  s3:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"

volumes:
  db:
    driver: local
  redis_data:
  postgres_data:
