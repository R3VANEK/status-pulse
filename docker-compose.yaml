version: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    user: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5434:5434"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  redis:
    image: redis:7.0.5
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    env_file:
      - .env

  api:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    restart: always
    command: uvicorn statusPulse.asgi:application --host 0.0.0.0 --port 8000 --reload

    tty: true
    stdin_open: true
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    depends_on:
      - db
      - redis
      - api
    command: celery -A statusPulse worker -E -l info
    env_file:
      - .env
    volumes:
      - ./backend:/app

  flower:
    build:
      context: .
      dockerfile: ./build/backend/Dockerfile
    depends_on:
      - db
      - redis
      - api
      - celery
    command: celery -A statusPulse flower --port=5555
    ports:
      - "${FLOWER_PORT}:5555"
    env_file:
      - .env
    volumes:
      - ./backend:/app

volumes:
  db:
    driver: local
  redis_data:
  postgres_data:
