repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        entry: bash -c 'cd frontend && npx eslint --fix "${@#frontend/}"' --
        language: system
        files: '^frontend/.*\.(js|jsx|ts|tsx)$'
        pass_filenames: true

      - id: frontend-prettier
        name: Frontend Prettier
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --
        language: system
        files: '^frontend/.*\.(js|jsx|ts|tsx|json|css|md|html|ya?ml)$'
        pass_filenames: true

      - id: frontend-typecheck
        name: Frontend TypeScript
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: '^frontend/.*\.(js|jsx|ts|tsx|json)$'
        pass_filenames: false
