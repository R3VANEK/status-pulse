repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        entry: python -c "import sys; sys.path.insert(0, 'backend'); from mypy.__main__ import console_entry; console_entry()"
        args: [--strict]
        exclude: "[a-zA-Z]*/(migrations)/(.)*"
        additional_dependencies:
          - celery==5.6.2
          - Django==5.2.11
          - django-stubs==5.2.9
          - psycopg2-binary
          - django-celery-beat
          - django-celery-results
          - celery-types
    env:
      PYTHONPATH: "backend"
