name: CI

on:
  pull_request:

jobs:
  be-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build image
        run: docker-compose -f docker-compose.test.yaml build

      - name: Run Ruff
        run: docker-compose -f docker-compose.test.yaml run --no-deps --rm api ruff check .

  fe-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

  fe-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build image
        run: docker-compose -f docker-compose.test.yaml build

      - name: Run tests
        run: |
          docker-compose -f docker-compose.test.yaml run --rm api \
          sh -c "python manage.py migrate && \
          coverage run  --parallel-mode manage.py test --durations=10 && \
          coverage combine  && \
          coverage report"

  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build image
        run: docker-compose -f docker-compose.test.yaml build

      - name: Check migrations
        run: |
          docker-compose -f docker-compose.test.yaml run --rm api \
          sh -c "python manage.py makemigrations --check --dry-run"
