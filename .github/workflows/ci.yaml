name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build image
        run: docker-compose -f docker-compose.test.yaml build

      - name: Run Ruff
        run: docker-compose -f docker-compose.test.yaml run --no-deps --rm web ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build image
        run: docker-compose -f docker-compose.test.yaml build

      - name: Run tests
        run: |
          docker-compose -f docker-compose.test.yaml run --rm web \
          sh -c "python manage.py migrate && pytest --cov=app --cov-report=term --cov-report=xml"
