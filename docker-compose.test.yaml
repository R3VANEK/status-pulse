version: "3.9"

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    command: ["postgres", "-p", "5434"]
    ports:
      - "5434:5434"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5434 -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.0.5

  api:
    build:
      context: .
      dockerfile: ./build/backend/test.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn statusPulse.asgi:application --host 0.0.0.0 --port 8000
    environment:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: db
      DB_PORT: 5434
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app
