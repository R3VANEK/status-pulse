version: "3.9"

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    command: ["postgres", "-p", "5432"]

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.0.5

  api:
    build:
      context: .
      dockerfile: ./build/backend/test.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_healthy
    command: uvicorn statusPulse.asgi:application --host 0.0.0.0 --port 8000
    tty: true
    stdin_open: true
    environment:
      DB_NAME: test_db
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT_URL: "http://s3:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - ./backend:/app

  s3:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: server /tmp/data --console-address ":9001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
